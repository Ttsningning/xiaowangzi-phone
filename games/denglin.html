:root{

}
.bar-in{max-width:1080px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.pov{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;padding:2px 8px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.meters{display:flex;align-items:center;gap:14px}

.meter svg{display:block}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border:1px solid var(--smoke);display:block}

.app{max-width:1080px;margin:0 auto;padding-block:28px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:32px}

.story{min-width:0;max-width:36em}

.text p.card{font-family:var(--f-display);color:var(--rose);border-left:2px solid var(--blood);padding-left:14px}

.choices{display:flex;flex-direction:column;gap:10px;margin-top:30px}

}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}

/* title */
.title{padding-top:4vh}
.fileno{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--whiskey)}
.big{font-family:var(--f-display);font-size:clamp(46px,13vw,92px);line-height:1.05;margin:14px 0 18px;letter-spacing:.06em;text-wrap:balance}
.big .r{color:var(--blood)}
.epi{font-size:16px;color:var(--dim);max-width:26em;border-left:2px solid var(--blood);padding-left:14px}
.primary{background:var(--paper);color:var(--ink);border:none;padding:12px 26px;cursor:pointer;font-family:var(--f-display);font-size:18px;letter-spacing:.2em}
.primary:hover{background:var(--whiskey)}
.gallery{margin-top:36px}
.gallery h3{font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--smoke);margin:0 0 10px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.slot{border:1px solid var(--line);padding:8px 10px;font-size:14px;color:var(--smoke)}
.slot.on{border-color:var(--blood);color:var(--rose)}
button.slot{background:none;text-align:left;cursor:pointer;width:100%;font-family:inherit;line-height:1.5}

.snd{background:none;border:1px solid var(--line);color:var(--dim);font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;padding:3px 8px;cursor:pointer;white-space:nowrap}
.snd[aria-pressed="false"]{color:var(--whiskey);border-color:var(--whiskey)}
/* toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-6px);z-index:30;background:rgba(14,19,17,.94);border:1px solid var(--blood);color:var(--rose);font-family:var(--f-display);font-size:15px;letter-spacing:.12em;padding:8px 18px;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;max-width:calc(100% - 32px);text-align:center}
.toast.s{border-color:var(--whiskey);color:var(--whiskey)}
.toast.h{border-color:var(--smoke);color:var(--dim)}
.toast.show{opacity:1;transform:translate(-50%,0)}

body.noscroll{overflow:hidden}
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,8,7,.82);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.ovbox{position:relative;background:var(--ink);border:1px solid var(--line);width:100%;max-width:720px;padding:22px 20px 26px;min-width:0}

.ovh{font-family:var(--f-display);font-size:26px;letter-spacing:.08em;margin:4px 0 4px;color:var(--paper)}

.ovbox img{display:block;width:100%;max-width:100%;border:1px solid var(--line);margin-bottom:16px}
.ovbox .quote{font-family:var(--f-body);color:var(--dim);border-left:2px solid var(--blood);padding-left:12px;margin:0 0 12px}
.ovbox .coda2{color:var(--paper);font-size:15px}

.map{display:flex;flex-direction:column;gap:18px}

  .fx p{animation:none}

}

p0:{chap:"序章 · 证物",pov:"he",title:"证物",clue:"garter",cg:"cg-crime",cgPos:"45% 55%",text:[
 "凌晨一点零七分，范德林宅邸的书房里还残留着雪茄和铁锈的气味。",
 "壁炉烧得太旺，热得人后背发潮。巡警们挤在门口，没人愿意往里多走一步，好像这间屋子里的钱和死亡一样，都会沾在鞋底上带回家。",
 "死者亚瑟·范德林，六十三岁，范德林航运的主人。这座城里一半的码头吊着他的旗，另一半欠着他的钱。此刻他仰面倒在波斯地毯上，一柄象牙柄裁信刀没入左胸，只露出半截。",
 "M1|“法医说晚上十点半到十一点之间。”搭档老蒙把帽子往后推了推，“一刀，干净利落。抽屉、保险柜都没动过。不是求财。”",
 "L|“在这栋房子里，没有什么事不是为了钱。”",
 "莱昂·肖探员戴上手套，蹲下身。死者的西装是伦敦定做的，袖扣是两颗小指甲大的蓝宝石，衬衫领口却有一圈洗不掉的黄渍。这个男人有全世界的钱，也有全世界的老人都有的那种气味。",
 "他的手指碰到死者胸前的口袋。里面鼓起一小块，软的。",
 "他取出了一样东西。",
 "E|一枚黑色蕾丝腿环。",
 "他将那事物移近几分。蕾丝边缘缀着一粒小小的红宝石，在台灯下像一滴没干透的血。",
 "M1|老蒙吹了声口哨：“老头子玩得挺花。”",
 "肖没有笑。",
 "这不能说明什么。那个自称未亡人的、幽灵般苍白的可疑女士，薇薇安·范德林，二十六岁，结婚第四十七天，目前有着无懈可击的不在场证明。",
 "但他相信自己对罪恶的嗅觉。",
 "凶手不会把这种东西留在尸体上，除非凶手想让人看见。这个过于刻意的证物，更像一封傲慢又轻佻的挑战书。",
 "像是有人隔着整座城，冲他眨了眨眼睛。"
],choices:[
 {t:"按程序封入证物袋，登记编号",go:"p1",d:{"s":1},flag:"logged"},
 {t:"不登记。他要亲手拿给她看，看她的表情",go:"p1",d:{"t":1}}
]},

p1:{chap:"第一章 · 威士忌",pov:"he",title:"威士忌",cg:"cg-scene",cgPos:"50% 45%",fv:"v3",fl:"l1",text:[
 "女主人在二楼的小客厅里。管家替他推开门，就退了出去，像退出一幕他早已看过太多遍的戏。",
 "房间里点着十几支蜡烛，窗外在下雨。探员找到她时，寡妇正在喝威士忌醒酒。",
 "楼下警车的灯还在一明一灭。她却换了一条黑色的蕾丝长裙，斜倚在皮质沙发上，长发散了满肩，像刚从一场无聊的舞会里提前退场，而不是刚从丈夫的尸体旁边走开。",
 "L|“女士，我合理怀疑是你刺杀了你的丈夫。”",
 "探员面无表情，完全无视了她斜倚在沙发上、高开叉裙底若有若无的风光。",
 "V2|女子睨了他一眼：“探员先生凶我的时候，能不能先放开我的腿环？”",
 {if:"logged",t:"他这才发觉，自己一直把那只证物袋攥在手里。透明的封袋被捏出了褶皱。"},
 {ifnot:"logged",t:"他这才发觉，自己一路都把那东西攥在手里。蕾丝贴着掌心，还带着一点温度，不知是死者的，还是他自己的。"},
 "严肃的表情出现一丝裂痕。手掌下意识攥紧，将那腿环捏在掌心。",
 "V|寡妇红唇轻勾：“呵呵，那就麻烦探员先生帮我穿上它。”",
 "她把一条腿搁上沙发扶手。黑色丝袜勾勒出她流畅如琴弦的小腿线条，裹住足尖点点红色指甲油。",
 "即使被黑丝笼罩，也依然能看出那如血般的红色。这个女人，就是这样踩着她的爱慕者们，登临顶级富豪的王座。",
 "她在等。蜡烛噼啪地响了一声。"
],choices:[
 {t:"单膝跪下，替她扣好腿环",go:"p2a",d:{"t":2}},
 {t:"“它是证物，现在属于警局。”",go:"p2b",d:{"s":1}},
 {t:"把腿环丢在她膝上：“自己穿。”",go:"p2c",d:{"t":1}}
]},

p2a:{chap:"第一章 · 威士忌",pov:"he",title:"扣环",clue:"scar",fv:"v3",fl:"l1",next:"p3",text:[
 "他单膝跪了下去。",
 "扣环冰凉，她的皮肤更凉。他把腿环推过她的膝弯，蕾丝一路往上，停在大腿中段。那里有一道极浅的旧疤，细长，泛白，像是很多年前被碎玻璃划过。",
 "他的手指在那道疤上停了半秒。",
 "V1|“十七岁，蓝鸢尾夜总会。”她说，像在说别人的事，“有位先生嫌香槟不够冰，把瓶子砸在了台上。我那天穿的裙子很短。”",
 "L|“后来呢？”",
 "V1|“后来他的银行倒了。”她晃了晃杯子，“我没做什么。我只是陪他的对手跳了一支舞。”",
 "扣环合上。他该站起来了，可他多跪了一秒。",
 "V3|“探员先生很熟练。”她俯下身，威士忌的气息落在他耳侧，“经常替嫌疑人穿衣服？”",
 "L3|“只替凶手。”他站起来，“通常是在验尸台上。”",
 "她笑出了声。那是今晚他第一次听见她笑。不像一个刚死了丈夫的女人，像一个刚赢了一局牌的赌徒。",
 "笑完了，她弯腰解开扣环，把那只腿环放回他掌心。",
 "V1|“证物，探员先生。收好了，别弄丢。”"
]},

p2b:{chap:"第一章 · 威士忌",pov:"he",title:"没收",fv:"v3",fl:"l1",next:"p3",text:[
 "L|“这是证物，”他把腿环收回口袋，“现在属于警局。”",
 "V|“真可惜。”她把腿放下，裙摆滑回原处，“那是一对。另一只还在我身上，你要不要也一起没收？”",
 "他没有回答。她也不需要他回答。",
 "她只是晃着酒杯，看着他耳根那一点几乎看不出的红，像在看一只误入陷阱、却还挺直脊背的猎犬。",
 "V1|“没关系。”她说，“警局的东西，迟早也要还给我的。这座城里的东西，最后都会回到我手里。”"
]},

p2c:{chap:"第一章 · 威士忌",pov:"he",title:"自己穿",fv:"v3",fl:"l1",next:"p3",text:[
 "腿环落在她的膝头。",
 "V|“好凶。”她用两根手指拈起它，不紧不慢地套上足尖，一寸一寸往上拉，眼睛始终看着他，“你要是一直这么凶，我会以为你在害怕。”",
 "L2|“怕什么？”",
 "V|“怕你自己。”",
 "扣环咔哒一声合上。他移开了视线，在三秒之后。",
 "这三秒她数得很清楚。他看得出来。"
]},

p3:{chap:"第一章 · 不在场证明",pov:"he",title:"不在场证明",fv:"v1",fl:"l1",text:[
 "她的不在场证明，干净得像刚熨过的衬衫。",
 "晚九点五十分，她抵达市立歌剧院的慈善晚宴。十余位宾客作证，她整晚没有离开大厅。十点四十一分，《晨报》的摄影记者拍下了她举杯的照片，照片里她站在市议员和银行家中间，笑得像这座城本身。十一点半，她的车才驶回宅邸。",
 "更要紧的是，十点十分，亚瑟·范德林还活着。他从书房的分机给自己的律师打过一通电话。",
 "L|“你丈夫死的时候，你在跟这座城最有钱的人碰杯。”",
 "V1|“我丈夫活着的时候，我也在跟这座城最有钱的人碰杯。”她纠正他，“区别是，现在他们要来跟我碰杯了。”",
 "L|“你一点也不难过。”",
 "V2|“我嫁给他四十七天。”她把空杯搁在一旁，“探员先生，你养一只狗四十七天，大概会比我难过一点。”",
 "她站起来，赤着脚走到窗边。雨水在玻璃上淌成一道一道的。",
 "V3|“所以，探员先生打算从哪里开始怀疑我？”"
],choices:[
 {t:"从这栋宅子开始：书房、管家、那通电话",go:"a1",route:"A"},
 {t:"从那个被剥夺了继承权的继子开始",go:"b1",route:"B"},
 {t:"从她开始。嫁进来之前，她是谁",go:"m1"}
]},

m1:{cg:"cg-gold",cgPos:"50% 40%",chap:"第二章 · 档案室",pov:"he",title:"爱慕者们",clue:"past",d:{t:1},text:[
 "市警局地下档案室，凌晨三点。灯泡嗡嗡响，像一只困在玻璃里的苍蝇。",
 "“薇薇安”这个名字，在婚礼之前的六年里，只出现在报纸的社交版和夜总会的海报上。",
 "十九岁，蓝鸢尾夜总会的头牌歌女，海报上的她穿一条红裙，嘴唇也是红的。",
 "二十一岁，她和银行家埃德蒙·格雷出双入对。一年后格雷银行被对手收购，格雷本人在疗养院里度过余生。收购格雷银行的人，第二年就给她买了一栋海边别墅。",
 "二十三岁，海边别墅的主人因挪用公款入狱。别墅在审判前一周，过户到了她的名下。",
 "二十五岁，她在一场慈善拍卖会上，以三倍的价格拍下一幅没人要的画。那天坐在她旁边的人，是亚瑟·范德林。",
 "C|没有一个人死于非命。也没有一个人，在认识她之后还保住了自己的东西。",
 "她的每一任爱慕者，都是一级台阶。亚瑟·范德林是最高的那一级。",
 "可是一级已经踩到顶的台阶，还有什么用？",
 "他合上卷宗，发现自己在黑暗里坐了很久。"
],choices:[
 {t:"她要的是全部。回宅子去，拆穿她的不在场证明",go:"a1",route:"A"},
 {t:"她太聪明了，不会亲自动手。去查那个继子",go:"b1",route:"B"}
]},

a1:{chap:"第二章 · 书房",pov:"he",title:"温度",clue:"heat",text:[
 "天亮前，他回到书房。尸体已经运走，地毯上留着一圈暗褐色的痕迹，边缘已经干了。",
 "M1|老蒙在走廊里打哈欠：“歌剧院那边十几个证人，还有报社的照片。你就是把她的不在场证明放进洗衣机里搅一夜，它也还是干净的。”",
 "L|“干净的东西，才最需要检查。”",
 "不对劲的是温度。",
 "十一月的夜里，窗户紧闭，窗帘拉得严严实实。壁炉的余烬还是烫的。有人把火烧得太旺了，旺到书桌这一侧的墙纸都微微起翘，镀金的画框摸上去像刚出炉的面包。",
 "他趴下来，在书桌底下摸到一只铜制的热水壶。壶塞松着，下面的地毯湿了一大片，正对着死者倒下时后背的位置。",
 "他在警校学过这个。人死之后，身体每小时大约凉下去一度，法医就是靠这个推算死亡时间。",
 "如果有人把尸体放在一间烧得滚烫的屋子里，再在他背后垫一壶热水呢？",
 "尸体凉得越慢，法医推定的死亡时间就越晚。",
 "C|晚到足以让一个九点五十分就站在歌剧院大厅里的女人，变得无辜。"
],choices:[
 {t:"叫醒管家，现在就问",go:"a2",d:{"s":1}},
 {t:"先上楼，在她的房门外站一会儿",go:"a1b",d:{"t":1}}
]},

a1b:{chap:"第二章 · 书房",pov:"he",title:"门缝",fv:"v3",next:"a2",text:[
 "走廊铺着厚厚的地毯，脚步落上去没有一点声音。",
 "尽头那扇门的门缝里还亮着灯。他在门外站了很久。手抬起来，又放下。",
 "他告诉自己，他只是在确认嫌疑人没有趁夜离开。",
 "门里有很轻的水声，然后是一个瓶塞被拔开的声音，然后是很长很长的安静。他几乎能想象出她靠在门的另一边，和他隔着一块木板，一起听着对方的呼吸。",
 "门里传来很轻的一句，像是贴着门板落进他耳朵里的：",
 "V|“探员先生，晚安。”",
 "他转身下楼，脚步比来时快。走到楼梯拐角，他才发现自己一直屏着气。"
]},

a2:{chap:"第二章 · 管家",pov:"he",title:"三十一年",clue:"butler",text:[
 "管家霍布斯站在厨房里，穿戴整齐，领结打得一丝不苟，像是一夜没睡，也像是早就在等人来问。",
 "他四十八岁，十七岁进范德林家当跟班，到今年是第三十一年。头发灰白相间，向后梳得服服帖帖，眼角有几道细纹，骨相一点没塌。厨房的女仆们到现在还会躲在走廊拐角偷看他，看完了红着脸跑开。",
 "炉子上温着一壶咖啡。他给探员倒了一杯，杯碟放下时没有发出一点声音。",
 "L|“壁炉是谁烧的？”",
 "H1|“老爷怕冷。是我按他的吩咐添的柴。”",
 "L|“添了多少？”",
 "H1|“老爷怕冷。”霍布斯又说了一遍。",
 "L|“十点十分那通电话，你听见了吗？”",
 "H1|“听见了，先生。老爷的嗓子有些哑，他前几日着了凉。”",
 "H2|他顿了顿，又补了一句：“夫人出门前也特意嘱咐过，让我夜里多照看老爷，说老爷最近睡不好。”",
 "这一句多余了。",
 "一个心里没有鬼的人，不会急着替别人作证。一个在这座宅子里沉默了三十一年的人，更不会。"
],choices:[
 {t:"逼近一步：“你在替她撒谎。”",go:"a2b",d:{"s":1},flag:"pressed"},
 {t:"递给他一支烟：“三十一年，你攒下了多少钱？”",go:"a2b",flag:"askedMoney",d:{"h":1}}
]},

a2b:{chap:"第二章 · 管家",pov:"he",title:"擦亮的皮鞋",next:"q1",text:[
 {if:"pressed",t:"霍布斯没有退。他垂下眼睛，看着自己擦得锃亮的鞋尖。"},
 {if:"pressed",t:"H2|“先生，我替范德林家说了三十一年的话。”他说，“哪句真哪句假，早就由不得我了。”"},
 {if:"askedMoney",t:"霍布斯接烟的手抖了一下，烟灰落在皮鞋上。他弯腰去擦，擦了很久。"},
 {if:"askedMoney",t:"H1|“够在乡下买一间小房子，先生。”他直起身，“运气好的话，带一个花园。”"},
 {if:"askedMoney",t:"他没说那间房子要给谁住。他的妻子二十年前就病死了，孩子走得更早。"},
 "他收走了探员的咖啡杯。那杯咖啡探员一口也没喝。",
 "走出厨房时，肖回头看了一眼。霍布斯站在晨光里，背挺得笔直，一只手一直按在背心口袋上，按得很用力。"
]},

b1:{cg:"cg-gym",cgPos:"50% 30%",chap:"第二章 · 继子",pov:"he",title:"拳馆",text:[
 "朱利安·范德林在码头区的地下拳馆里。",
 "空气里是汗、血和廉价雪茄的味道。他赤着上身，正把一个比他壮一圈的码头工人打倒在地，然后弯腰把那人拉起来，往他兜里塞了一张钞票。周围的人吹口哨，喊他“小少爷”。",
 "他三十四岁，亚瑟唯一的儿子。眉眼跟他父亲年轻时的照片一模一样，只是更瘦，更凶，眼底有一圈熬夜熬出来的青。",
 "五周前，婚礼后的第十天，亚瑟改了遗嘱，把他的名字整个划掉了。",
 "J|“你是为那个女人来的吧。”他擦着指节上的血，“她就是条毒蛇。我父亲娶她那天，我就知道他活不长。”",
 "L|“昨晚十点到十一点，你在哪儿？”",
 "J|“这里。”他张开手臂，像要拥抱整间屋子，“所有人都能作证。”",
 "周围的人笑起来。没有一个人说话。"
],choices:[
 {t:"“你欠赌场多少钱？”",go:"b2"},
 {t:"“毒蛇？你好像很了解她。”",go:"b1b",d:{"t":1,"s":1}}
]},

b1b:{chap:"第二章 · 继子",pov:"he",title:"毒蛇",next:"b2",text:[
 "朱利安笑了，舔了舔嘴角的伤口。",
 "J|“婚礼前一晚，我去了她房里。”他说，“我想看看我爸花了半个码头买回来的东西长什么样。”",
 "J|“她拿一把拆信刀抵着我的喉咙，笑着告诉我：下次再来，记得敲门。”",
 "他摸了摸自己的脖子，那里什么也没有，他却像摸到了一道疤。",
 "J|“你知道最要命的是什么吗，探员？”他凑近一点，酒气扑上来，“她说的是‘下次’。”",
 "肖发现自己握紧了拳头。",
 "他告诉自己，那是出于对证人的厌恶。"
]},

b2:{chap:"第二章 · 继子",pov:"he",title:"四万元",clue:"debt",next:"q1",text:[
 "拳馆老板不认识什么“所有人”，他只认钱。",
 "他从保险柜里拿出一张欠条，抖了抖：朱利安·范德林欠款四万元，十一月一日到期。也就是今天。",
 "“小少爷是好人。”老板说，“好人欠钱，也是要还的。他爸活着，这笔钱是零头。他爸死了，遗嘱上又没他的名字……”他耸耸肩，“那就不好说了。”",
 "后门的门童收下两块钱，想起来了。",
 "“朱利安先生昨晚十点前就走了，开的是他那辆绿色的车。十一点多才回来。”",
 "L|“回来的时候有什么不一样？”",
 "门童想了想：“他换了一双鞋。我给他开的门，他走路的声音不一样了。原来那双是带铁掌的，咔咔响。”"
]},

q1:{cg:"cg-interro",cgPos:"50% 45%",chap:"第二章 · 审讯室",pov:"he",title:"第一次正式问话",fv:"v1",fl:"l1",text:[
 "第二天下午，市警局二楼，三号审讯室。",
 "这间屋子他用了八年。一张铁桌，两把椅子，一盏吊灯，墙上一面单向玻璃。码头上最硬的打手在这里哭过，市议员的儿子在这里尿过裤子。",
 "她走进来的时候，像走进了一家她不太满意的餐厅。",
 "她没有带律师。黑色套装，黑色手套，帽檐上压着一小片黑纱。她先掏出手帕，把铁椅子的椅面擦了一遍，才坐下来，交叠起双腿。",
 "L|“姓名。”",
 "V|“你知道我叫什么。”",
 "L|“程序。”",
 "V2|“薇薇安·范德林。娘家姓，没有。出生地，不记得了。职业，寡妇。”",
 "老蒙在单向玻璃后面咳了一声，大概是在憋笑。",
 "L|“你和你丈夫最后一次说话，是什么时候？”",
 "V|“晚上九点二十分。我出门前去书房跟他道别。”",
 "L|“说了什么？”",
 "V1|“他说，你今晚很美。我说，谢谢。”她顿了顿，“他每天晚上都说同一句话。四十七天，一个字也没变过。我有时候想，他是不是只会说这一句。”",
 "他抬起头看她。九点二十分。她自己说出了这个时间，像随手把一张牌摊在桌上，看他敢不敢接。",
 "L|“你爱他吗？”",
 "这不在程序里。老蒙在玻璃后面又咳了一声，这次不是在笑。",
 "她慢慢摘下一只手套，一根手指一根手指地往下褪。",
 "V3|“探员先生，”她说，“这个问题，你是替警局问的，还是替你自己问的？”"
],choices:[
 {t:"“替警局。”",go:"q1a",d:{"s":1}},
 {t:"沉默，合上记录本",go:"q1b",d:{"t":1}},
 {t:"“替一个死人问的。”",go:"q1c"}
]},

q1a:{chap:"第二章 · 审讯室",pov:"he",title:"替警局",fv:"v2",fl:"l1",next:"q2",text:[
 "L|“替警局。”",
 "V2|“那警局可以记下来：不爱。”她把摘下的手套搭在桌沿，“我嫁给他，是因为他是这座城里最有钱的人。他娶我，是因为我是这座城里最好看的女人。我们都拿到了自己想要的，这叫公平交易。”",
 "L|“现在他死了。你拿到了更多。”",
 "V|“那是他运气不好，不是我运气太好。”",
 "她站起来，戴回手套。",
 "V1|“还有别的问题吗？没有的话，我约了裁缝。丧服要改腰身，我这两天瘦了。”",
 "她走到门口，忽然回头。",
 "V3|“对了，你的记录本上，我的名字写错了一个字。‘薇’是草字头。你写的是‘微’。”",
 "他低头去看。她没有说错。他不知道她是什么时候看见的。"
]},

q1b:{chap:"第二章 · 审讯室",pov:"he",title:"合上的本子",fv:"v3",fl:"l2",next:"q2",text:[
 "他没有回答。他合上了记录本。",
 "这个动作让她愣了一下。她大概见过很多男人在她面前慌乱、狡辩、讨好，却没见过一个人在她面前选择什么都不说。",
 "审讯室里只剩下吊灯的嗡嗡声。她手里还捏着那只摘了一半的手套。",
 "V2|“你知道吗，”她终于开口，声音比刚才低，“你是第一个问我这个问题的人。所有人都默认了答案。连我自己都是。”",
 "L2|“那答案是什么？”",
 "V1|“你先告诉我，你为什么想知道。”",
 "他们看着彼此。谁也没有先说。",
 "玻璃后面，老蒙敲了敲玻璃。时间到了。",
 "她起身，把那只手套留在了桌上，像是忘了。",
 "他知道她没有忘。她这样的女人，从来不会忘记任何东西。他把那只手套放进了抽屉，没有登记。"
]},

q1c:{chap:"第二章 · 审讯室",pov:"he",title:"替死人问",fv:"v2",fl:"l1",next:"q2",text:[
 "L|“替一个死人问的。他已经没有机会问你了。”",
 "她的表情变了一下。很细微，像湖面上一圈还没成形就消失了的涟漪。",
 "V2|“他问过。”她说，“婚礼那天晚上，他喝多了，坐在床边问我：薇薇安，你爱我吗？”",
 "L|“你怎么回答的？”",
 "V|“我说爱。”她把手套重新戴好，“他很高兴。他高兴得像个孩子，抱着我说他这辈子值了。”",
 "V2|“第二天早上，他就让律师去查我在海边那栋别墅的来历。”",
 "她站起来，平静地整理了一下帽檐上的黑纱。",
 "V1|“老人就是这样，探员先生。他们要你说爱，又不肯相信。所以我后来就不说了。省得他们麻烦。”",
 "门在她身后关上。他坐在空荡荡的审讯室里，忽然觉得这间屋子从来没有这么冷过。"
]},

q2:{chap:"第二章 · 审讯室",pov:"he",title:"玻璃后面",next:"i1",text:[
 "她走了以后，他推开了观察室的门。",
 "老蒙坐在单向玻璃后面，帽子扣在胸口，一动不动，像在教堂里。",
 "M1|“莱昂，”他头也不回，“我干了二十六年警察。抓过杀妻的，抓过弑父的，抓过把亲生孩子卖去南美的。”",
 "M2|“我从来没有像今天这样，希望一个嫌疑人是无辜的。”",
 "L|“你被她迷住了。”",
 "M1|“我？”老蒙笑了一声，把帽子扣回头上，“我五十二岁，老婆孩子都有，她连我叫什么都不知道。”",
 "他站起来，走到门口，又停下了。",
 "M2|“可是你看见她摘手套的那个样子了吗？我当时在想，她要是隔着这块玻璃看我一眼，叫我替她去坐牢，我大概会问一句：坐几年？”",
 "门关上了。",
 "他一个人站在观察室里，看着玻璃那边空荡荡的铁椅子。椅子上还留着一点她的香水味，从门缝里一路飘到这边来。",
 "楼下值班的年轻警员在走廊里跟人说话，声音压得很低，可他还是听见了：“……她冲我笑了，你信不信？她进门的时候，冲我笑了。”",
 "他发现自己没有笑。"
]},

i1:{cg:"cg-oldman",cgPos:"40% 40%",chap:"幕间 · 她",pov:"she",title:"老人味",fv:"v2",text:[
 "凌晨四点，薇薇安·范德林坐在梳妆台前，慢慢解下了另一只腿环。",
 "镜子里的女人看起来很累。她已经很久没有允许自己看起来累了。",
 "她拔开一瓶香水，在手腕上点了一下，又一下，又一下。不管点多少，她总觉得还能闻到那股味道。",
 "樟脑丸。药油。假牙浸泡液。还有一种说不清的、从皮肤底下慢慢渗出来的甜腻，像放了太久的水果。",
 "四十七天。每天夜里，那个味道都躺在她身边。",
 "他喜欢摸她的头发，一边摸一边讲他二十岁的时候怎么在码头上跟人抢地盘。他讲同一个故事讲了六遍。他记不住她喜欢喝什么酒，却记得每一艘船的吨位。",
 "她嫁给他的第九天，拿到了他的私章。第二十天，董事会里有三个人开始叫她“范德林夫人”时，不再带着那种看花瓶的笑。第四十天，码头上有一半的工头，月底拿的是她签字的红包。",
 "他发现得太晚了。老人总是发现得太晚。",
 {if:"routeA",t:"楼下厨房里，霍布斯还没睡。她听得见他擦银器的声音，一下，一下，不紧不慢。整栋房子里，只有这个声音让她安心。"},
 "她想起那个探员。年轻，干净，站得笔直，西装的肩线是警局薪水买得起的最好的那种。他身上没有任何味道。只有雨，和一点点枪油。",
 "V|“嫉恶如仇，”她对着镜子轻声说，“那你最好真的恨我。”",
 "镜子里的女人笑了一下，又不笑了。"
],choices:[
 {t:"拨通警局的电话，指名找肖探员",go:"i2",d:{"t":1},her:true},
 {t:"把香水瓶放下，关灯",go:"f1",her:true}
]},

i2:{chap:"幕间 · 她",pov:"she",title:"电话",fv:"v3",fl:"l2",next:"f1",text:[
 "电话转了三次才接通。那头的声音很清醒，不像是被吵醒的。",
 "L|“肖。”",
 "V|“是我。”",
 "长久的沉默。听筒里只有电流声，和他压得很低的呼吸。她听见他划了一根火柴。原来他也没睡。",
 "V2|“你还没睡。”",
 "L|“你打来就是为了说这个？”",
 "V|“我只是想问，你今天，有没有想我？”",
 "L|“我在想怎么把你送上绞架。”",
 "V1|“那就是想了。”",
 "电话那头安静了很久。久到她以为他已经挂了。",
 "L2|“……把门锁好。”他终于说，“这栋房子里刚死过人。”",
 "她先挂了电话。挂断前，她听见他好像笑了一声，又好像没有。",
 "她握着听筒坐了很久，直到天边发白。"
]},

f1:{chap:"第三章 · 葬礼",pov:"he",title:"黑纱",cg:"cg-funeral",cgPos:"50% 35%",fv:"v2",next:"f2",text:[
 "葬礼在三天后，圣三一大教堂，下着雨。",
 "全城体面的人都来了。来送亚瑟·范德林的不多，来看他遗孀的不少。",
 "她戴着黑纱站在灵柩旁，一滴眼泪也没掉。后排有人小声说她冷血，前面马上有人回头瞪他。说话的人闭了嘴，过了一会儿，自己也忍不住朝前面看。",
 "肖站在最后一排的柱子后面。银行家吻了她的手背。市议员握着她的手不肯放。范德林航运的三个董事轮流俯身在她耳边说话，一个比一个弯得低。",
 "她偶尔抬眼，隔着黑纱扫过人群。有一次，那目光停在了他那根柱子上。",
 "只停了一秒。他却觉得自己被当众点了名。",
 {if:"routeB",t:"仪式进行到一半，教堂的大门被撞开了。朱利安·范德林浑身湿透地站在门口，领带歪着，手里拎着半瓶酒。"},
 {if:"routeB",t:"J|“你答应过我的——”他冲着灵柩旁的女人喊，话没说完，就被两个侍者架了出去。"},
 {if:"routeB",t:"满堂寂静。她连头都没回。只有肖看见了，她戴着黑手套的手指，在念珠上轻轻收紧了一下。"},
 {if:"routeA",t:"仪式结束时，霍布斯替她撑开黑伞。那把伞一路斜向她那边，他自己的半边肩膀被雨浇透了，好像一点也没察觉。"},
 {if:"routeA",t:"上车前，她伸手替他拂掉肩上的雨水。霍布斯在台阶上站住了。车开出去很远，他还站在原地。"},
 "V|走出教堂时，她经过他身边，没有停步：“探员先生来送我丈夫，还是来看我？”",
 "他没有回答。雨落在他的帽檐上。"
]},

f2:{chap:"第三章 · 遗嘱",pov:"he",title:"未签的遗嘱",clue:"will",cg:"cg-arthur",cgPos:"50% 22%",fv:"v1",next:"f3",text:[
 "遗嘱宣读安排在宅邸的图书室。作为调查人员，肖有权列席。",
 "惠特莫尔律师戴上眼镜，声音平板得像在念一张货运单。",
 "范德林航运百分之七十的股份、宅邸、乡间庄园、收藏的画、所有现金与债券，由遗孀薇薇安·范德林继承。管家霍布斯获得一笔养老金。几家慈善机构获得捐赠。",
 "朱利安·范德林的名字，一次也没出现。",
 "图书室里只有壁炉在响。她坐在高背椅里，双腿交叠，听自己变成这座城最有钱的女人，表情像在听天气预报。",
 "宣读结束，众人散去。肖留了下来。",
 "L|“十点十分那通电话里，亚瑟说‘明天把新遗嘱带来’。新遗嘱写的是什么？”",
 "老律师摘下眼镜，擦了很久。",
 "W2|“这话我不该说。”他压低声音，“反正它永远生效不了了。新遗嘱里，夫人每个月只领一笔生活费。公司的控制权，交回朱利安少爷手里。”",
 "W2|“亚瑟跟我说，他老了，眼睛还没瞎。他娶回家的是一只狐狸，一口一口把他的公司吃空了。”",
 "W1|老律师把眼镜戴回去，停了一会儿，又说：“然后他跟我说，乔治，可我每天早上醒过来，还是想先看她一眼。”",
 "肖没有接话。",
 "W1|“我当时想，他是老糊涂了。”惠特莫尔看着窗外，“后来夫人来事务所签过一次字。她走以后，我在办公室里坐了一下午，什么也没干。”",
 "C|一份永远签不了的遗嘱。一个死在签字前夜的男人。",
 "肖走出图书室时，她站在走廊的窗前，手里端着一杯酒，像是在等他。",
 "V|“惠特莫尔先生跟你说了新遗嘱的事吧。”她没有回头，“那个老家伙守不住秘密。我丈夫信了他三十年，到死也没发现。”"
]},

f3:{chap:"第三章 · 守灵夜",pov:"he",title:"一支舞",fv:"v3",fl:"l1",text:[
 "按照这座城的老规矩，葬礼当晚，宅邸里有一场守灵宴。",
 "说是守灵，其实和任何一场晚宴没有区别。留声机放着慢调子，香槟塔堆得比人还高，宾客们压低声音谈笑，偶尔想起来，才朝客厅尽头那幅亚瑟的遗像举一举杯。",
 "她换下了黑纱，换上一条仍然是黑色、却低到背脊中央的长裙。整个晚上，她身边没有空过。",
 "快到午夜时，她终于从人群里走出来，穿过整个大厅，停在他面前。",
 "V|“探员先生，你在我家看了我一整晚。”她伸出手，“不如近一点看。”",
 "留声机换了一张唱片。整个大厅的人都在看他们。"
],choices:[
 {t:"握住她的手，带她进舞池",go:"f3a",d:{"t":2}},
 {t:"“我在执勤，夫人。”",go:"f3b",d:{"s":1}},
 {t:"拒绝，然后看着她和别人跳",go:"f3c",d:{"t":1}}
]},

f3a:{cg:"cg-waltz",cgPos:"50% 30%",chap:"第三章 · 守灵夜",pov:"he",title:"慢三步",fv:"v3",fl:"l1",next:"o1",text:[
 "他的手搭上她的腰。裙子开得太低，他的掌心直接贴在她的脊背上，像贴着一块被炉火烘了很久的大理石。",
 "她跳得很好。好得不像一个寡妇，像一个从小就靠这个吃饭的人。",
 "V|“你跳得很糟。”她在他耳边说。",
 "L|“警校不教这个。”",
 "V|“那警校教什么？怎么把手放在女人的腰上，还假装自己在搜身？”",
 "他的手没有挪开。她也没有让它挪开。",
 "一个转身，她的额头几乎碰到他的下巴。她身上是很淡的香水味，底下压着一点威士忌，再底下是一种他说不出来的东西，像雨落在热的石头上。",
 "V2|“这屋子里每个人都在算我值多少钱。”她低声说，“你是唯一一个在算我有多少罪的。你知道这有多新鲜吗？”",
 "L|“你很快就会觉得不新鲜了。”",
 "V1|“那可说不准。”",
 "唱片停了。她退后一步，行了个屈膝礼，像在舞会上，也像在法庭上。周围有人鼓掌。他站在原地，掌心还是烫的。"
]},

f3b:{chap:"第三章 · 守灵夜",pov:"he",title:"执勤",fv:"v2",fl:"l1",next:"o1",text:[
 "L|“我在执勤，夫人。”",
 "她的手停在半空。整个大厅都在看。有人轻声笑了。",
 "她却没有一点难堪的样子。她把那只手收回去，顺势理了理他的领带，动作自然得像一个妻子在出门前替丈夫整理衣领。",
 "V|“执勤。”她重复了一遍，像在尝一个新学会的词，“那就好好地执，好好地勤。我倒想看看，你能盯我多久。”",
 "她转身走回人群，背脊挺得笔直，那一截裸露的皮肤在灯下白得刺眼。",
 "他发现自己一整晚都没能再把视线从那上面挪开。好好地执勤。"
]},

f3c:{cg:"cg-dance",cgPos:"50% 30%",chap:"第三章 · 守灵夜",pov:"he",title:"别人的手",fv:"v1",next:"o1",text:[
 "他没有接她的手。",
 "她也不恼，只是笑了笑，转身就被范德林航运最年轻的那位董事接进了舞池。那人二十八九岁，金发，笑起来有酒窝，手放在她腰上的位置比他敢放的低一寸。",
 "他站在香槟塔旁边，看他们跳完了一整支舞，又跳了第二支。",
 "第二支舞跳到一半时，她越过那个金发男人的肩膀，看了他一眼。",
 "她什么也没说。她只是用口型说了一个词。",
 "他读懂了。那个词是：“后悔？”",
 "他放下酒杯，去了阳台。外面在下雨，他在雨里站了很久，直到身上的热度一点一点退下去。"
]},

o1:{cg:"cg-clock",cgPos:"50% 35%",chap:"第三章 · 歌剧院",pov:"he",title:"十点四十一分",clue:"photo",next:"o2",text:[
 "市立歌剧院的后台像一座迷宫。走廊两边堆满了上一季的布景，纸板做的城堡，石膏做的天使，一棵倒在地上的假棕榈树。",
 "《晨报》的摄影记者是个年轻人，叫托比，手指被显影液泡得发黄。他翻出那天晚上的底片，对着灯一张一张地看。",
 "“十点四十一分那张，是我拍得最好的一张。”他说，语气里有点得意，“您看，构图，光线，全对。主编说可以上头版，要不是第二天出了命案，就上了。”",
 "照片上，她站在大厅正中，举着香槟，身后是歌剧院那座有名的镀金大钟，指针清清楚楚：十点四十一分。",
 "L|“你是怎么想到在这个时候拍的？”",
 "“说来也巧。”托比挠了挠头，“我本来在拍市长夫人。范德林夫人走过来，跟我说，年轻人，你的闪光灯挡住了钟。我就挪了个位置。她站的那个地方，正好能把钟拍进去。”",
 "“然后她对我笑了一下，说：‘现在拍。就现在。’”",
 "托比把底片收回去的时候，手顿了一下。他从钱夹里抽出一张小小的照片，是同一卷底片洗出来的另一张。照片上的她没有看镜头，侧着脸，在笑。",
 "“这张我没交给报社。”年轻人的脸一直红到耳根，“您……您不会没收吧？”",
 "“我这行干了五年，”托比说，“从来没有人教过我什么时候按快门。可那天我就是照做了。您说怪不怪？”",
 "他不觉得怪。",
 "C|一张有钟的照片，比十个证人都可靠。她知道这一点，所以她亲自挑了站的位置，挑了按快门的时刻。",
 "一个提前准备好不在场证明的人，一定提前知道，那天晚上自己需要一个不在场证明。"
]},

o2:{chap:"第三章 · 她的城",pov:"he",title:"每一个人",next:"@afterFuneral",text:[
 "那一周，他走遍了这座城里和她有过交集的每一个地方。",
 "花店的老板娘说，范德林夫人每周二来买一枝红玫瑰，从来不要包装纸，付钱的时候总会多留一枚硬币，说是给店里那只瘸腿的猫。“她怎么可能杀人？”老板娘瞪着他，“她连那只猫都记得名字。”",
 "裁缝铺的老师傅说，夫人改丧服那天，在镜子前面站了很久，然后转过身来问他：“您看，我这样穿，像一个伤心的人吗？”老师傅说他这辈子没见过那么好看的伤心。",
 "银行的年轻出纳说，夫人每次来都排队，从来不让经理给她开后门。他为了在她来的那天当班，跟同事换了整整三个月的周五。",
 "码头上的工头们说得更直白。老爷子在的时候，红包从来没有准时过。夫人接手以后，红包每月一号准时到，还多了一成。“谁要是敢动她，”一个满脸刀疤的大个子说，“得先问问码头上这三百号兄弟。”",
 "连蓝鸢尾夜总会那个看门的老头都记得她。十九岁那年冬天，她把自己的大衣给了他，说她穿着红裙子跳舞，反正不冷。",
 "他把这些都记在了本子上，记了整整七页，没有一个字能用作证据。",
 "回警局的电车上，他翻着那七页纸，忽然明白了一件事。",
 "这座城里的每一个人，都知道她是什么样的女人。贪心，狠，满嘴谎话，踩着男人的肩膀往上爬。他们全都知道。",
 "C|可他们还是爱她。",
 "电车经过范德林宅邸的时候，他抬头看了一眼。二楼的窗子亮着灯。",
 "他发现自己在找她的影子。"
]},

a3:{chap:"第四章 · 电话",pov:"he",title:"两句话",clue:"lawyer",next:"a4",text:[
 "周一上午九点，惠特莫尔律师事务所。墙上挂着一排泛黄的毕业证书，最早那张比肖的岁数还大。",
 "老律师看见他，叹了口气，像看见一张迟早要来的账单。",
 "W1|“我太太今早还在问，夫人上回带来的那盒杏仁饼是在哪儿买的。”他说，“探员，我先跟你说清楚，我一点也不想帮你。”",
 "L|“十点十分那通电话，我只想听你一字一句再说一遍。”",
 "老律师把双手交叠在肚子上，闭上眼睛。",
 "W1|“电话响的时候我已经睡了。我太太接的，说是范德林先生。我拿起听筒，那头说：‘明天把新遗嘱带来。’我问是不是九点到。那头说：‘别告诉任何人。’然后就挂了。”",
 "L|“声音呢？”",
 "W1|“哑。很哑。像嗓子里塞了一团棉花。”",
 "L|“你跟他通了三十年电话。你确定那是他？”",
 "老律师睁开眼，很久没说话。窗外一辆电车叮叮当当地开过去。",
 "W2|“……他平时会叫我的名字。”他终于说，“三十年，每一次第一句都是‘乔治，是我’。那天晚上没有。”",
 "W2|“他也没回答我的问题。我问是不是九点到，他直接说了另一句。”老律师的声音低下去，“那头的人，好像只会说那两句。”",
 "C|只会说两句，是因为只练了两句。",
 "W2|肖起身要走，老律师在背后叫住他：“探员。你要是真查出什么来，能不能别让我上庭？我这把年纪了，不想当那个把她送上绞架的人。”"
]},

a4:{chap:"第四章 · 管家的房间",pov:"he",title:"存折",clue:"ledger",cg:"cg-bankbook",cgPos:"50% 45%",text:[
 "下午，趁霍布斯进城替夫人去银行办事，肖进了宅邸半地下的管家房。",
 "房间很小，收拾得一丝不乱。一张铁床，一个衣柜，墙上一张褪色的全家福：年轻的霍布斯满头黑发，身边站着一个瘦弱的女人，怀里抱着一个裹在毯子里的孩子。",
 "床垫底下压着一个油布包。包里是两样东西。",
 "第一样是一本旧账簿，手写，字迹工整得像印出来的。三十一年里，范德林家每一笔采买、每一份薪水、每一次修缮，都被悄悄多记了一点。一点乘以三十一年，够一个管家坐二十年牢。",
 "账簿最后一页，有人用红墨水写了个日期：九月二十四日，她嫁进这栋房子的第十天。下面一行小字，不是霍布斯的笔迹。女人写的，圆润，漂亮，有一点漫不经心的倾斜：",
 "C|“我替你保管了。——V”",
 "第二样是一本存折。户名霍布斯。十月二十九日，案发前两天，存入五万元。汇款人：范德林夫人私人账户。",
 "五万元。一个管家三十一年的薪水加起来也没有这么多。可存折上的余额一直停在那里，一分没有取过。",
 "他想起霍布斯在厨房里说的话：运气好的话，带一个花园。",
 "她先攥住了他的罪，再替他付了买花园的钱。从那天起，这个在范德林家闭了三十一年嘴的人，只为一个人开口。"
],choices:[
 {t:"把油布包放回原处，上楼",go:"a5"},
 {t:"弯腰再看一眼床底。最深处好像还有一只铁皮盒",go:"a4h",d:{"h":2},flag:"tin"}
]},

a4h:{cg:"cg-tin",cgPos:"50% 45%",chap:"第四章 · 管家的房间",pov:"he",title:"铁皮盒",clue:"tin",next:"a5",text:[
 "他差一点就漏掉了它。",
 "床底最深处，一只印着苏格兰格子的铁皮饼干盒，边角锈得几乎打不开。他用拆信刀撬了很久。",
 "盒子里没有钱。",
 "一方女人的手帕，熨得平平整整，叠成四方。角上绣着一个V，中间印着一枚很淡的口红印，像有人曾经用它按过嘴唇，然后随手丢掉了。",
 "一枝压干的红玫瑰，颜色暗得发黑。只有玫瑰园里那种南方红壤，才养得出这个颜色。",
 "一叠剪报，按日期排好：蓝鸢尾夜总会的旧海报，社交版上她和银行家的合影，婚礼当天的头版。每一张都剪得边角整齐，像他擦银器时一样小心。",
 "最底下压着一张信纸，只写了一行，又被划掉了。划痕很重，却还看得清：",
 "C|夫人，我这一生只为一个人说过谎。",
 "他在那张铁床上坐了很久。",
 "三十一年的假账，五万块，一个按住了他命门的女人。他原本以为，这是一桩威胁和收买的交易。",
 "可是一个被威胁的人，不会把对方用过的手帕熨平了收起来。",
 "他把盒子原样推回床底，连灰尘的痕迹都抹成了原来的样子。他自己也说不清，为什么要替一个嫌疑人保守这个秘密。"
]},

a5:{chap:"第四章 · 更衣室",pov:"he",title:"衣柜里的人",fv:"v3",fl:"l2",text:[
 "他本该就此离开的。证据已经够他写一份报告。",
 "可是他上了楼。他想找到那只没有被他没收的、另一只腿环。他想把它们放在一起，看它们到底是不是一对。",
 "她的更衣室比他的公寓还大。一整面墙的长裙，一整面墙的鞋，空气里是她的香水味，浓得像一只手按在他胸口。",
 "他在梳妆台的第二个抽屉里找到了它。和他口袋里那只一模一样，只是那颗红宝石在右边。",
 "门外响起了脚步声。高跟鞋，不急不慢。",
 "他没有时间多想，闪身进了衣柜。门合拢的一瞬间，更衣室的门开了。",
 "透过百叶门的缝隙，他看见她走进来，把手里的黑纱扔在椅子上，背对着衣柜，抬手去够背后的拉链。",
 "拉链往下滑了一寸。两寸。",
 "V|“探员先生，”她头也不回地说，“你的鞋露在外面。”",
 "他推开柜门。她已经转过身来，拉链停在背脊中央，没有拉上，也没有再往下。",
 "V1|“警局现在都这么查案吗？”",
 "L2|“我在找证物。”",
 "V3|她看了一眼他手里的腿环，慢慢走过来，近到他能看见她睫毛上没擦干净的一点睫毛膏：“找到了吗？”"
],choices:[
 {t:"把两只腿环一起放在梳妆台上，转身离开",go:"a5a",d:{"s":1}},
 {t:"替她把拉链拉上",go:"a5b",d:{"t":2}},
 {t:"不动，等她先开口",go:"a5c",d:{"t":1}}
]},

a5a:{chap:"第四章 · 更衣室",pov:"he",title:"一对",fv:"v2",next:"i3",text:[
 "他把两只腿环并排放在梳妆台上。红宝石一左一右，像一双眼睛。",
 "L|“它们是一对。”他说，“就像你和霍布斯。”",
 "她的笑容第一次停住了。只停了一瞬，然后又回来了，比刚才更漂亮。",
 "V|“你去过管家房了。”",
 "L|“我会再来的。下一次带着搜查令。”",
 "他拿回自己带来的那一只，走出更衣室。身后很安静，没有挽留，没有辩解。他走到楼梯口时，才听见她在身后很轻地说了一句：",
 "V|“那我等你。”",
 "他分不清那是一句威胁，还是一句别的什么。"
]},

a5b:{cg:"cg-zipper",cgPos:"50% 25%",chap:"第四章 · 更衣室",pov:"he",title:"拉链",fv:"v3",fl:"l1",next:"i3",text:[
 "他把找到的那只腿环放回抽屉，伸手绕到她背后，捏住了那枚小小的拉链头。",
 "她没有动，只是微微仰起脸看他。他们之间只隔着一只手的距离，他能感觉到她的呼吸落在他的下颌上，一下，又一下。",
 "拉链往上走得很慢。比他这辈子做过的任何一件事都慢。他的指背贴着她的脊椎，一节一节地往上数，像在数一串念珠，像在数他还剩多少理由可以不吻她。",
 "拉链到顶了。他的手没有离开。",
 "V2|“你在发抖。”她说。",
 "L|“这里太热了。”",
 "V3|“是吗。”她的手覆上他的胸口，隔着衬衫，按在心脏的位置，“那这里呢？这里也是因为太热？”",
 "他握住了她的手腕。他本来是想把那只手拿开的。",
 "楼下传来汽车的声音，霍布斯回来了。",
 "她先退开了。她理了理头发，又是那个刀枪不入的范德林夫人。",
 "V1|“下次，”她说，“记得敲门。”"
]},

a5c:{chap:"第四章 · 更衣室",pov:"he",title:"沉默",fv:"v1",fl:"l1",next:"i3",text:[
 "他没有动，也没有说话。",
 "她也没有。两个人就那么站着，像两个在牌桌上都不肯先亮牌的赌徒。",
 "最后是她先笑了。",
 "V|“你知道吗，我丈夫活着的时候，每次我站在这里，他都要在门口看着。”她说，“他喜欢看我换衣服。看完了，会说一句：值了。”",
 "V2|“你也觉得值吗，探员先生？你攒一辈子的薪水，够买这面墙上的一条裙子吗？”",
 "L|“我不买东西。”他说，“我只抓人。”",
 "V3|“那你抓到我了吗？”",
 "他没有回答。他把腿环放回抽屉，合上，从她身边走过去。肩膀擦过她的肩膀。",
 "他走出门的时候，听见她在身后笑出了声。"
]},

b3:{chap:"第四章 · 红土",pov:"he",title:"闩上的窗",clue:"soil",next:"b4",text:[
 "那双鞋塞在朱利安汽车的后备箱里，用一张《晨报》裹着。报纸的日期是案发当天，社交版上印着慈善晚宴的照片，她举着杯，在照片的正中间。",
 "鞋是意大利手工的，鞋跟钉着铁掌。鞋底嵌着一层暗红色的泥。",
 "整座城里只有一个地方有这种土：范德林宅邸的玫瑰园。亚瑟花大价钱从南方运来的红壤，说只有这种土养得出他要的那种红玫瑰。",
 "他回到宅邸，绕到玫瑰园。雨断断续续下了一个多星期，泥地上什么也看不出来了。但通往书房的那扇落地窗外面，有一丛玫瑰被踩断了，断口还是新的。",
 "可是现场报告写得清清楚楚：那扇落地窗，案发当晚是从里面闩上的。",
 "有人在朱利安离开之后，替他关上了窗。",
 "他站在窗外往里看。书房的地毯已经换过了，新的，深红色，看不出任何痕迹。",
 "那天晚上十一点半回到宅子、比管家更早走进书房的人，只有一个。"
]},

b4:{chap:"第四章 · 继子的公寓",pov:"he",title:"412",clue:"key",text:[
 "朱利安住在河对岸一栋旧公寓的顶楼。房租欠了三个月，房东开门时骂骂咧咧。",
 "屋里一团糟。空酒瓶、没洗的衬衫、赛马报，墙上用图钉钉着一张从杂志上撕下来的照片：蓝鸢尾夜总会的旧海报，十九岁的她穿着红裙，嘴唇是红的。",
 "照片被钉得很用心，四个角都钉了，像钉一张圣像。",
 "床头柜的抽屉里，有一把黄铜钥匙。钥匙牌上刻着：蓝鸢尾酒店，412。",
 "蓝鸢尾酒店是蓝鸢尾夜总会楼上的那家。肖打了个电话，前台的人翻了很久的本子。",
 "“412是长包房，先生。从八月起，一直包着。登记的名字是……范德林。”",
 "L|“哪一位范德林？”",
 "“这个，本子上没写。付钱的时候用的是现金。”",
 "八月。那时她还没有嫁进范德林家。那时她还只是亚瑟·范德林的新情人，而朱利安·范德林，还是这座城里最有希望的继承人。"
],choices:[
 {t:"把钥匙登记进卷宗：继子和继母之间有事",go:"b4a",d:{"s":1},flag:"keyLogged"},
 {t:"一个痴心妄想的继子罢了。把钥匙放回去",go:"b4b",d:{"t":1}}
]},

b4a:{chap:"第四章 · 继子的公寓",pov:"he",title:"登记",next:"b5",text:[
 "他把钥匙装进证物袋，写上编号。",
 "笔尖在纸上停了一下。他发现自己写字的力气比平时大，把纸都划破了。",
 "M1|老蒙在电话里听完，嘿嘿笑了两声：“继母和继子，有意思。老头子知道吗？”",
 "L|“不知道。”他说，“或者知道了，所以改了遗嘱。”",
 "挂了电话，他在朱利安的屋子里又站了一会儿。墙上的她十九岁，红裙，笑得什么都不怕。",
 "他把那张照片也取了下来，夹进了卷宗。他对自己说，这也是证物。"
]},

b4b:{chap:"第四章 · 继子的公寓",pov:"he",title:"放回去",next:"b5",text:[
 "他把钥匙放回了抽屉。",
 "一个欠了一屁股债的继子，偷偷用父亲的名义包了一间酒店房间，用来做他的白日梦。这种事，他在这座城里见得多了。",
 "他对自己说，这就是全部。",
 "可是走下楼梯的时候，他一直在想那面墙上的照片，想那四颗钉得端端正正的图钉，想她说的那句“下次记得敲门”。",
 "她对多少人说过下次？"
]},

b5:{chap:"第四章 · 蓝鸢尾",pov:"he",title:"老钢琴师",clue:"call",fl:"l1",next:"i3",text:[
 "蓝鸢尾夜总会白天不开门。后门没锁，肖推门进去，舞台上只亮着一盏灯，一个老头坐在钢琴前，一下一下按着同一个键。",
 "“调音呢。”老头没回头，“这台琴，她走了以后就没人弹准过。”",
 "他叫阿尔多，在蓝鸢尾弹了三十年琴。薇薇安十七岁来这儿唱歌，第一首就是他伴奏的。",
 "“她那时候连双像样的鞋都没有。”阿尔多说，“穿一双借来的红鞋，大了半码，脚后跟塞着报纸。上台前她问我，阿尔多先生，这屋里谁最有钱？我指给她看。那天晚上，她一整首歌都看着那一个人唱。”",
 "“第二个礼拜，那个人给她买了二十双鞋。”",
 "L|“她伤过谁吗？”",
 "老头终于转过身来，看他的样子像在看一个问了蠢问题的孩子。",
 "“她让每个男人都觉得自己是那一个。等他们发现自己不是，她已经站到下一级台阶上去了。”他摊开两只手，“这算伤人吗？我七十一岁了，探员。我到现在也觉得自己是那一个。”",
 "楼上就是蓝鸢尾酒店。前台换了个年轻姑娘，翻本子翻得很慢。",
 "“412是八月包下的。不是朱利安先生自己订的，是一位女士打电话来，说替范德林家订房。钱是一个跑腿的小男孩送来的，现金，信封上一个字也没写。”",
 "L|“那位女士叫什么？”",
 "姑娘想了想，脸红了：“她没说。可她在电话里问我，这么晚还值班，冷不冷。我到现在都记得她的声音。”",
 "肖走出酒店，站在蓝鸢尾那块褪了色的霓虹招牌底下，抽完了一根烟。",
 "八月。那时候她还只是亚瑟的情人，朱利安还是范德林家唯一的继承人。她替一个还没成为她继子的男人，订好了一间房。"
]},

i3:{chap:"幕间 · 她",pov:"she",title:"夜访",fv:"v3",fl:"l2",text:[
 "凌晨一点，市警局三楼只剩一盏灯。",
 "值班的警员看见范德林夫人从楼梯上走上来，愣了足足五秒，才想起来要拦。她只是冲他笑了笑，他就忘了自己要拦什么。",
 "她推开那扇磨砂玻璃门。他坐在一堆卷宗后面，衬衫袖子卷到手肘，领带扯松了，正对着一盏台灯写报告。他抬起头，看见她，钢笔在纸上洇出一个墨点。",
 "V1|“我来报案。”她说，“我睡不着。这算不算一桩罪？”",
 "L2|“……谁放你上来的？”",
 "V|“你们警局的门，比我家的还好进。”",
 "她走过去，在他的办公桌上坐下，裙摆压住了他正在写的那份报告。她歪头看了一眼，是倒着的，可她看懂了，那上面写着她的名字。",
 "V2|“你写我写了几页了？”",
 "L|“十一页。”",
 "V3|“我丈夫给我写过一封情书，只有半页。”她说，“你比他用心多了。”",
 "台灯的光打在她的侧脸上。他看着她，她看着他。窗外的城市还没有睡，远处有一艘船在拉汽笛。",
 "她该走了。她知道。她来这里，本来只是想看看这个男人一个人的时候是什么样子。",
 "现在她看见了。他一个人的时候，也在想她。"
],choices:[
 {t:"伸手替他解开那条已经松了的领带",go:"i3a",d:{"t":2},her:true},
 {t:"把一直藏在手包里的东西放在他桌上，然后离开",go:"i3b",d:{"t":1},her:true}
]},

i3a:{cg:"cg-tie",cgPos:"50% 30%",chap:"幕间 · 她",pov:"she",title:"领带",fv:"v3",fl:"l2",next:"c1",text:[
 "她伸出手，勾住了那条领带。",
 "他没有躲。他只是看着她，像看着一颗已经拉开了保险的手榴弹。",
 "结一点一点地松开。丝绸从他的领口滑出来，落在她的掌心里，还带着他的体温。",
 "V2|“你每天都打这么紧的结吗？”她问，“不累吗？”",
 "L2|“……累。”",
 "这是他第一次对她说真话。她听出来了。",
 "她把那条领带绕在自己的手腕上，绕了两圈，打了个结，举起来给他看，像在展示一副手铐。",
 "V1|“现在你也有一件东西在我这里了。”她跳下桌子，“我们扯平了，探员先生。”",
 "她走到门口，回头看了一眼。他还坐在原处，领口敞着，台灯下的样子一点也不像个警察。",
 "她下楼的时候，发现自己在笑。她已经很多年没有这样笑过了。不是为了让谁看。"
]},

i3b:{chap:"幕间 · 她",pov:"she",title:"留下的东西",fv:"v2",next:"c1",text:[
 "她从手包里取出一样东西，放在他那十一页报告上面。",
 "是那另一只腿环。红宝石在右边。",
 "V|“凑成一对吧。”她说，“省得你天天惦记。”",
 "L|“这是在认罪？”",
 "V1|“这是在送礼。”她站起来，“探员先生，你得学会分辨这两件事。在这座城里，它们经常长得一模一样。”",
 "她走了。高跟鞋的声音在空荡荡的走廊里响了很久。",
 "他把那只腿环拿起来，和口袋里那只并在一起。红宝石一左一右，严丝合缝。",
 "他在台灯底下坐到天亮，也没想好该把它登记成证物，还是收进自己的抽屉。"
]},

c1:{chap:"终章 · 雨夜",pov:"he",title:"两杯酒",cg:"cg-her",cgPos:"50% 38%",fv:"v2",text:[
 "又一个雨夜。",
 "他没带搭档，也没带搜查令。出门前老蒙拦了他一下。",
 "M2|“莱昂，你要是去抓人，我陪你去。你要是去干别的……”老蒙把帽檐往下压了压，“那我今晚什么也没看见。”",
 "他没有回答。",
 "霍布斯替他开了门，接过他湿透的帽子，一句话也没说，就退进了走廊尽头的暗处。整栋房子静得像一座博物馆。他穿过走廊，推开书房的门。",
 "她在等他。",
 "壁炉生着火，和那天晚上一样旺。雨水顺着玻璃往下淌，烛光碎在里面。她坐在亚瑟生前最喜欢的那张皮沙发上，一条黑色长裙，长发散着，赤着脚。",
 "茶几上一瓶威士忌，两只杯子。她倒了两杯，把一杯推到他面前。",
 "V|“你查到了。”她说。没有问号。",
 "他站在门口，她坐在火边。他知道她说过的话一半是假的，另一半也未必是真的。他还是来了。",
 "这座城里每个靠近她的人，大概都是这么来的。"
],choices:[
 {t:"走过去，接过酒杯，一饮而尽",go:"c2",d:{"t":1},flag:"drank"},
 {t:"站在原地：“我在执勤。”",go:"c2"}
]},

c2:{chap:"终章 · 雨夜",pov:"he",title:"那个名字",fl:"l1",fv:"v2",text:[
 {if:"drank",t:"酒很烈，从喉咙一路烧下去。她看着他喝完，眼里有一点他读不懂的东西，像满意，又像告别。"},
 {ifnot:"drank",t:"她也不勉强，自己把两杯都喝了，杯底磕在大理石上，叮的一声。“那就公事公办吧，探员先生。”"},
 "他从大衣口袋里取出那枚腿环，放在两人之间的茶几上。红宝石映着火光，像一滴刚流出来的血。",
 {if:"routeA",t:"他的另一只口袋里装着一个牛皮纸信封。热水壶的照片，律师的证词，管家房里那本账簿和存折的照片。足够把一个人送上绞架。"},
 {if:"routeB",t:"他的另一只口袋里装着一个牛皮纸信封。欠条，门童的证词，一双沾着红土的鞋。还有一把刻着412的黄铜钥匙的照片。"},
 "L|“我知道是谁杀了亚瑟·范德林。”",
 "窗外一道闪电，把整间书房照得惨白。她没有眨眼。她只是安静地看着他，等他说出那个名字。"
],choices:[
 {t:"“是你，薇薇安。”",go:"@her"},
 {t:"“是管家，霍布斯。”",go:"@butler"},
 {t:"“是朱利安。”",go:"@julian"},
 {t:"“……我还不能断定。”",go:"@unknown"},
 {t:"把那个牛皮纸信封，扔进壁炉",go:"@burn",req:"burn"},
 {t:"“这不是你一个人的案子。”他转头看向书房的门",go:"rH",req:"pair"}
]},

rA:{chap:"终章 · 真相",pov:"he",title:"挑战书",fv:"v2",fl:"l1",next:"@endA",text:[
 "L|“你在去歌剧院之前就杀了他。九点二十分前后。”",
 "他一件一件摆出来。烧得过旺的壁炉，书桌下的热水壶，一通只说了两句、没有叫律师名字的电话，一本写着“我替你保管了”的账簿，一笔五万元的汇款。",
 "L|“热让尸体凉得更慢，死亡时间被推迟了一个多小时。十点十分的电话是霍布斯打的，他只排练了那两句。你握着他三十一年的罪，又替他付清了买花园的钱。从那天起，他就是你的人了。”",
 "她听完，轻轻鼓了鼓掌。掌声在雨声里很轻，像几滴落在伞面上的水。",
 "V1|“你比我想的还要快。”",
 "L|“为什么？”他问，“你已经拥有一切了。再等十年，他自己就会死。”",
 "V2|“十年？”她笑了，“他发现了，探员先生。他发现那只花瓶会咬人。第二天早上九点，惠特莫尔就要带着新遗嘱进门，我就会变回一个每个月领生活费的女人，看他儿子的脸色过日子。”",
 "她站起来，走到壁炉边，看着火。",
 "V2|“而且你知道和一个六十三岁的男人睡在同一张床上是什么感觉吗？樟脑，药油，假牙。他讲同一个故事讲了六遍。他摸我的头发，像摸一匹他刚买回来的马。”",
 "V|“我等了他四十七天。四十七天，我已经很有耐心了。”",
 "L|“那腿环呢？”",
 "她转过身来，火光在她身后，她的脸在暗处。",
 "V3|“这座城里的男人，要么想买我，要么想睡我，要么两样都想。”她说，“我想知道，有没有一个人，只想抓住我。”",
 "V1|“现在我知道了。”"
]},

rB:{chap:"终章 · 真相",pov:"he",title:"迟到一步",fv:"v2",fl:"l1",next:"@endB",text:[
 "他把那双裹着报纸的鞋放在茶几上，就放在腿环旁边。",
 "L|“十点二十分，朱利安从玫瑰园进了书房。他欠了四万块，今天到期，他来找他父亲要钱。他们吵起来，他抓起了桌上的裁信刀。然后他从落地窗走了，踩断了一丛玫瑰。”",
 "L|“十一点半，你回到家，比管家更早走进书房。你看见了尸体，闩上了那扇窗，然后把你的腿环放进了他的口袋。”",
 "她没有否认。她只是给自己又倒了一杯酒。",
 "L|“为什么？”",
 "V2|“你是问我为什么关窗，还是为什么放腿环？”",
 "L|“都问。”",
 "V|“关窗，是因为我推开书房门的那一秒，就明白了这屋子里发生了什么。”她说，“我还没想好要不要让朱利安被抓。一个活着的、欠着我人情的继子，有时候比一个上了绞架的继子有用。”",
 "V3|“至于腿环。”她看着那颗红宝石，“一个有铁一样不在场证明的女人，被警察怀疑得越久，大家就越觉得她可怜。等真相出来的那天，整座城都会站在我这边。”",
 "V1|“况且，我想看看来的是什么人。”",
 "她抬起眼睛看他。",
 "V2|“我嫁给亚瑟是为了钱，我从来不否认。这座城里每一个人都以为能买到我，或者能定我的罪。”她说，“你是第一个，两样都没做到的人。”"
]},

rH:{chap:"终章 · 两个人",pov:"he",title:"第三个杯子",cg:"cg-third",cgPos:"50% 35%",fv:"v2",fl:"l1",next:"E11",text:[
 "L|“这不是你一个人的案子。”",
 "他没有看她。他看着书房的门。",
 "L|“九点二十分你动手，九点五十分你已经站在歌剧院里。可壁炉要一直添柴，热水壶要按时换，十点十分要有人打那通电话，十一点前还得有人把刀柄擦干净。”",
 "L|“这些事都要一个留在屋里的人。一个在这栋房子里走了三十一年路、从没让人听见过脚步声的人。”",
 "门开了。",
 "霍布斯站在门口，手里端着银托盘，托盘上放着第三只酒杯。领结一丝不苟，灰白的头发梳得服服帖帖，像一直就站在门外，等着被叫到名字。",
 "H1|“先生说得对。”他平静地说，“柴是我添的。”",
 "她转头看了他一眼。很短。肖在审讯室里看过上千双眼睛，他认得这一种：两个人在同一条船上，船在漏水，谁也没打算跳。",
 "V1|“探员先生，”她转回来，笑得和第一天晚上一模一样，“我只问一件事。你进管家房那天下午，带搜查令了吗？”",
 "他没有回答。",
 "V|“没有搜查令拿到的账簿，到了法庭就是一叠废纸。存折也是。”她把腿环推回他面前，“剩下什么？一只热水壶，一个记性不好的老律师，和一个整晚在歌剧院里举杯的寡妇。”",
 "V2|“你知道答案。可这座城里，只有你知道。”",
 "霍布斯把第三只杯子放在茶几上，替他斟满，然后退到她椅子后面站好。",
 "肖想起那天晚上的腿环，守灵夜那支舞，更衣室，深夜的警局。每一回他心跳得发疼，她都恰好在看他。",
 "她一直看着他，好让他也一直看着她。这样他就没工夫回头，去看站在她身后的那个人。",
 "奇怪的是，他并不恨她。他甚至有一点感激。被她这样骗过一回，这辈子也算见过一次神。"
]},

E1:{chap:"结案",pov:"he",title:"猩红判决",ending:"E1",cg:"cg-cuffs",cgPos:"50% 35%",fv:"v2",coda:"他赢了官司，输了剩下的一切。她连一天也没有真的输过。",text:[
 "他替她戴上手铐的时候，她没有挣扎。",
 "金属扣上手腕，咔哒一声。她低头看了一眼，像在看一只新买的手镯，然后抬起头冲他笑了笑。",
 "V|“探员先生，你是个好人。”她说，“好人通常没什么钱，也没什么好下场。我替你可惜。”",
 "审判持续了两个月。她请了全城最贵的律师。旁听席每天坐满，门外排队的人从法院台阶一直排到电车站。",
 "证据就是证据。热水壶，账簿，存折，一通只会说两句话的电话。陪审团议了两天，判了有罪。宣读判决的时候，有两个陪审员一直没敢抬头看她。",
 "终身监禁。她站在被告席上听完，表情和听遗嘱那天一样。",
 "事情没有就此结束。",
 "宣判后第三周，《晨报》登出一封请愿信，要求州长特赦范德林夫人。第一批签名的是范德林航运的十一位董事，后面跟着码头的工头、蓝鸢尾的老乐手、歌剧院的摄影记者、圣三一教堂的神父。第二个月，签名到了四万。",
 "第十九个月，特赦令下来了。",
 "她出来那天，监狱门口停了二十几辆车。她换了一条红裙，上了第一辆，直接去了范德林航运的董事会。会议室里十一个男人全体起立，像她只是出了一趟远门。",
 "他站在马路对面的人群里，看着那辆车开走。",
 "那枚腿环一直锁在证物科地下室第四排的铁柜里。结案以后，他再没去看过。",
 "法律判了她，这座城替她把判决撕了。到头来，被关起来的只有他一个。"
]},

E2:{chap:"结案",pov:"he",title:"买不起的人",ending:"E2",cg:"cg-prison",cgPos:"50% 35%",fv:"v2",fl:"l1",coda:"他是这座城里唯一一个她买不起的人。所以她把他整个带回了家。",text:[
 "手铐扣上的声音，和那天腿环合上的声音一模一样。",
 "她把手腕递给他，没看手铐，一直看着他的眼睛。",
 "V|“只要你开个价，我什么都给得起。”她轻声说，“股份，宅子，你下半辈子在海边晒太阳的钱。还有我。”",
 "L|“我知道。”",
 "V2|“那你为什么不开？”",
 "他扣上第二只手铐，手指在她腕骨上停了一下，很轻，像那天替她扣腿环。",
 "L|“开了价，你就会看不起我。”",
 "她愣了一会儿，笑出声来，眼眶红了，和她的指甲油一个颜色。",
 "V1|“对。”她说，“我会的。”",
 "律师当天下午就办好了保释。她没有签字。",
 "V|“我不走。”她隔着铁栏对律师说，“我要这座城看着我从正门出去。”",
 "审判拖了十一个月。她每天换一条黑裙出庭，旁听席上的人一天比一天多。报纸起先叫她“范德林夫人”，后来干脆只叫“夫人”。",
 "检察官把热水壶、账簿和存折一件件摆上桌。辩护律师只问了陪审团一个问题：你们谁真的相信，这样一个女人，需要亲手去杀一个老头子？",
 "陪审团出去了四十七分钟。",
 "无罪。",
 "她出来那天是秋天，监狱门口落满了枫叶。记者和花篮挤在马路那头，她没往那边看。",
 "他站在门口。十一个月，他两鬓白了一片。手里拿着那只腿环，是他从证物科借出来的，借条上签的是他自己的名字。",
 "V3|“你抓住我了。”她说。",
 "L|“他们放了你。”",
 "V1|“他们放了我。”她走过去，从他手里拿走那只腿环，“你没有。”",
 "她把腿环塞回他大衣口袋，挽住他的胳膊，朝路边等着的车走过去。",
 "V2|“回家吧，探员先生。董事会等了我十一个月，再等一晚也不要紧。”"
]},

E3:{chap:"结案",pov:"he",title:"替罪羊",ending:"E3",cg:"cg-office",cgPos:"50% 35%",fv:"v1",coda:"一个男人替她付了最后的账，还觉得自己占了便宜。他第一次亲手放走了罪恶，也说不出哪里后悔。",text:[
 "L|“是霍布斯。”",
 "她眼里有什么东西暗了一下，又亮起来，比刚才更冷。",
 "第二天清晨，霍布斯穿戴整齐，领结一丝不苟，走进警局自首。",
 "他的供词严丝合缝：他贪了范德林家三十一年的钱，老爷发现了，要送他去坐牢。柴是他添的，电话是他打的，刀是他握的。",
 "每个细节都对得上。只有一件事不对：法医说那一刀是从下往上捅进去的，握刀的人比死者矮半个头。霍布斯比亚瑟高。",
 "M2|老蒙拍了拍他的肩膀：“结案吧，莱昂。上面满意，报社满意，所有人都满意。”",
 "他签了字。",
 "结案那天，她来警局领回丈夫的遗物：一块金表，一枚戒指，一只空钱夹。经过他办公桌的时候，她把一杯威士忌放在他的卷宗上。",
 "V|“谢谢你没看清，探员先生。”",
 "他把那杯酒喝了。",
 "陪审团认定他是一时激愤失手，霍布斯被判了二十年。宣判那天，他在被告席上一直望着旁听席第一排。她穿着一条墨绿色的裙子，冲他点了一下头。他就笑了。",
 "后来肖听说，范德林夫人每个月往监狱里寄一个包裹：烟草，咖啡，一本新出的书。寄件人那一栏从来不写名字。"
]},

E4:{cg:"cg-cheque",cgPos:"50% 35%",chap:"结案",pov:"he",title:"棋子",ending:"E4",fv:"v1",coda:"凶手伏法。真正的赢家，从来没有坐上过被告席。",text:[
 "朱利安·范德林在第二天傍晚被捕。拳馆里的人一哄而散，没有一个人替他说话。",
 "审讯室里，他只撑了四个小时。",
 "J|“是她！”他把桌子拍得砰砰响，“是她跟我说，新遗嘱里我一分钱也拿不到！是她说老头子要把我送去南美！412的钥匙是她给我的！你们去问她！”",
 {if:"keyLogged",t:"他把那把钥匙的照片推到朱利安面前。朱利安盯着它，突然不说话了，脸上的表情像一个刚发现自己输光了的赌徒。"},
 "可是酒店前台说不清是哪一位范德林。新遗嘱的内容，惠特莫尔说夫人不可能知道。一个欠了四万块赌债、在葬礼上发酒疯的继子，说的话没有人信。",
 "朱利安被判绞刑。按照法律，杀害被继承人者，丧失全部继承权。",
 "这一条，她大概比任何律师都背得熟。",
 "执行那天，她没有去。她在范德林航运的董事会上，被全票推举为董事长。",
 "一周后，他的办公桌上多了一个没有署名的信封。里面是一张支票，金额栏空着，背面写着一行字，圆润，漂亮，带着一点漫不经心的倾斜：",
 "C|谢谢你替我做完了最后一件事。",
 "他把支票撕了，撕得很碎。他想明白了一件事：从他在死者口袋里摸到那只腿环开始，他就是这盘棋上的一枚子。",
 "而他到最后，也只吃掉了她想让他吃的那一颗。",
 "那天夜里他在桌前坐到天亮，脑子里想的却不是那盘棋，是她走出教堂时看他的那一眼。",
 "他想，如果她现在走进来，叫他再替她做一件事，他大概还是会做。",
 "他恨的不是她。他恨的是这一点。"
]},

E5:{cg:"cg-rain",cgPos:"55% 30%",chap:"结案",pov:"he",title:"赤足的证人",ending:"E5",fv:"v3",fl:"l3",coda:"那封挑战书，从一开始就是寄给他的。她什么也没有失去，还多赢了一个人。",text:[
 "朱利安在第三天被捕。审讯室里，他把什么都说了，包括那些不该说的。",
 "她被传唤了四次。每一次都穿着黑裙，戴着手套，坐得笔直，回答每一个问题，一句多余的话也没有。闩上窗户、在尸体上放腿环，这些足够让她被起诉妨碍司法。",
 "检察官问他的意见。他想了一夜。",
 "第二天，他在报告里写：范德林夫人返家时受到惊吓，行为失当，情有可原。",
 "这是他当警察八年，写过的唯一一句假话。",
 "朱利安·范德林被判绞刑。按照法律，杀害被继承人者，丧失全部继承权。范德林家的一切，从码头到股份，从宅邸到墙上的每一幅画，从此只属于一个名字。",
 "撤诉的那天傍晚，下着和那晚一样的雨。她走出警局，站在台阶底下，没有打伞。",
 "他把外套披在她肩上。",
 "V|“你为什么要替我说谎？”她问，“你明明那么讨厌说谎的人。”",
 "L|“我讨厌的是说谎骗人的人。”他说，“我没有骗任何人。那天晚上，你确实受到了惊吓。”",
 "V2|“我没有。”",
 "L3|“我知道。我说的是我。”",
 "她看了他很久，然后笑起来，弯腰脱掉了被雨浸透的高跟鞋，赤着脚走上台阶，走进他的伞下。",
 "V3|“你欠我一个解释，探员先生。”",
 "L3|“在哪里？审讯室？”",
 "V1|“你家。”她说，“我听说你那里也有威士忌。虽然一定很便宜。”",
 "那只腿环一直在他的大衣口袋里，贴着心口，放了很久。",
 "第二天早上，范德林航运的董事们在会议室里等了二十分钟，董事长才姗姗来迟。她的头发还有一点湿，领口别着一枚男式的领带夹。",
 "十一个男人同时站了起来。没有一个人敢问。"
]},

E6:{cg:"cg-suitors",cgPos:"50% 40%",chap:"结案",pov:"he",title:"新的王座",ending:"E6",fv:"v1",coda:"他一无所获。她什么都有了，包括数不清的年轻情人。只是没有一个，像他那样看过她。",text:[
 "那个名字出口的瞬间，他就从她的眼神里知道，自己错了。",
 "她甚至没有掩饰。她只是很轻、很轻地叹了口气，像一个老师看着最得意的学生在考场上交了白卷。",
 "V|“探员先生，”她说，“我以为你会是那个人。”",
 "朱利安有一整间拳馆的人作证。检察官只看了一眼报告，就把它扔回了他的桌上。证据不足。案子在月底挂起，变成档案室里又一份发黄的卷宗。",
 "冬天过去了。春天，范德林航运召开了新一届董事会。会议室里坐着十一个男人，都比她年长二十岁以上，都在她进门时站了起来。",
 "那年的社交季，她是这座城里每一场舞会的女主人。",
 "报纸的社交版上，她身边的面孔每隔几个月就换一张。一个刚从剑桥回来的银行家之子。一个在歌剧院唱男高音的意大利人。一个打马球的，一个写诗的，一个什么都不做、只负责长得好看的。",
 "他们都年轻，都英俊，身上都没有任何老人的气味。她给他们买表，买车，买公寓，然后在某一天，忽然就不再接他们的电话。",
 "奇怪的是，他们之中没有一个人怪她。被她丢掉的男人，在俱乐部里喝多了说起她，语气都像在说一场这辈子再也做不到的好梦。有一个后来去了非洲，每年圣诞节还给她寄一箱咖啡豆，从来没有附过一个字。",
 "第二年冬天，他在市政厅的慈善晚宴上执勤。",
 "她从旋转楼梯上走下来，挽着一个二十出头的金发青年，青年的眼睛像一只刚被领回家的小狗。整个大厅都在看她。",
 "她看见了站在柱子后面的他。",
 "她隔着整个大厅，冲他举了举杯。",
 "那天夜里，他收到一瓶二十五年的威士忌。卡片上只有一行字，带着很淡的香水味：",
 "C|下次，再快一点。——V",
 "他把酒倒进了水槽。倒到一半，又停了下来。"
]},

E7:{cg:"cg-armchairs",cgPos:"50% 50%",chap:"结案",pov:"he",title:"雨夜悬案",ending:"E7",fv:"v1",fl:"l1",coda:"一个永远没有答案的问题。也许正是他们都想要的。",text:[
 "L|“我还不能断定。”",
 "她看了他很久，然后笑了。那是他见过她最真的一次笑。没有表演给谁看。",
 "V|“你知道吗？这座城里所有人都急着给我定罪，或者急着替我脱罪。”她说，“你是第一个说‘不知道’的人。”",
 "她把腿环推回他面前。",
 "V2|“留着吧。等你确定了，再来还给我。”",
 "雨下了一整夜。案子一直没有结。",
 "后来，他每隔一段时间就会去一次范德林宅邸。不带搭档，不带搜查令，只带着一个问题。",
 "每一次，她都已经倒好了两杯酒。",
 "他们坐在书房里，隔着那张茶几，从天黑聊到天亮。聊这座城，聊码头上的船，聊他抓过的人，聊她爬过的台阶。从来不聊那天晚上。",
 "有一年冬天，她问他：“你还在查吗？”",
 "他说：“在。”",
 "她就笑了，给他添满了酒。",
 "这些年里，她的生意越做越大。范德林航运的船开到了南美，开到了东方，码头上的旗多了一倍。来求见她的人在宅邸门口排成长队，银行家，议员，外国的公爵，每一个都带着戒指来，每一个都空着手走。",
 "城里的人说，范德林夫人谁也不嫁，是因为她心里有一个人。没有人知道那个人是谁。",
 "他知道。他每次推开书房门，看见茶几上已经倒好的那两杯酒，就知道。",
 "那枚腿环，他一直没有还给她。她也一直没有要。"
]},

E8:{chap:"结案",pov:"he",title:"沦陷",ending:"E8",cg:"cg-burn",cgPos:"50% 40%",fv:"v3",fl:"l3",coda:"她什么都没放弃，也什么都没失去。连他也是她赢来的。",text:[
 "信封落进火里，边缘卷起来，发黑，烧着了。",
 "热水壶的照片，律师的证词，账簿照片上那一行红墨水：“我替你保管了”。火一样一样舔过去，舔过她的名字，也舔过他当了八年警察攒下的那点骄傲。",
 "她站了起来。她没看火，一直在看他。",
 "V2|“你知道你在干什么吗？”她的声音有一点抖。他第一次听见她声音抖。",
 "L|“知道。”",
 "V|“我杀了人。为了钱杀了我丈夫。以后为了钱，我还会干别的。”",
 "L|“我知道。”他走到她面前，“从我在他口袋里摸到那只腿环开始，我就知道。”",
 "V2|“那你——”",
 "他没让她说完。",
 "那个吻很长。壁炉里的纸烧成了灰，窗外的雨停了一阵，又下起来。她攥着他的衬衫，指节发白。他尝到威士忌，还有一点咸。过了很久他才反应过来，那是她的眼泪。",
 "V1|“我本来没打算爱上谁。”她把脸埋在他颈窝里，声音闷闷的，“这不在计划里。”",
 "L3|“我也没有。”",

 ["E1","猩红判决"],["E2","买不起的人"],["E3","替罪羊"],["E4","棋子"],["E5","赤足的证人"],

const TMAX = 10, SMAX = 5, TLINE = 5, BURN = 7;

/* ---------- state ---------- */
const KEY = "widow-garter-v2", EKEY = "widow-garter-endings-v2";
function fresh(){ return {scene:null, t:0, s:0, h:0, clues:[], flags:[], route:null, last:null}; }
let st = fresh();
let unlocked = [];
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) st = Object.assign(fresh(), JSON.parse(r)); }catch(e){}
  try{ const r = localStorage.getItem(EKEY); if(r) unlocked = JSON.parse(r) || []; }catch(e){}
}
function save(){

}

/* ---------- seen scenes ---------- */

try{ seen = JSON.parse(localStorage.getItem(SEENKEY) || "[]") || []; }catch(e){ seen = []; }
function markSeen(id){ if(seen.indexOf(id) < 0){ seen.push(id); try{ localStorage.setItem(SEENKEY, JSON.stringify(seen)); }catch(e){} } }

/* ---------- sound ---------- */
const AMB_RAIN = new Set(["p0","p1","p2a","p2b","p2c","p3","f1","c1","i3","i3a","i3b","E5"]);
const AMB_FIRE = new Set(["a1","a2","a2b","f2","i1","i2","c2","rA","rB","rH","E7","E8"]);
const MUS_JAZZ = new Set(["m1","f3","f3a","f3b","f3c","o1","b5","E6"]);
const VOL = {theme:.42, jazz:.38, rain:.32, fire:.5};
const Snd = {ctx:null, master:null, bufs:{}, cur:{mus:null, amb:null}, nodes:{mus:null, amb:null}, on:true};
Snd.on = false;
try{ Snd.on = localStorage.getItem("widow-sound-v2") === "on"; }catch(e){}
function audioInit(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC || !window.AUD || !Snd.on) return;
  if(!Snd.ctx){
    try{ Snd.ctx = new AC(); }catch(e){ return; }
    Snd.master = Snd.ctx.createGain();
    Snd.master.gain.value = Snd.on ? 1 : 0;
    Snd.master.connect(Snd.ctx.destination);
  }
  if(Snd.ctx.state === "suspended"){ try{ Snd.ctx.resume(); }catch(e){} }
}
function getBuf(k){
  if(!Snd.bufs[k]){
    Snd.bufs[k] = fetch(AUD[k]).then(response => {
      if(!response.ok) throw new Error("Audio HTTP " + response.status);
      return response.arrayBuffer();
    }).then(bytes => new Promise((resolve, reject) => {
      const pending = Snd.ctx.decodeAudioData(bytes, resolve, reject);
      if(pending && pending.catch) pending.catch(reject);
    })).catch(error => {
      delete Snd.bufs[k]; // Allow a later attempt after an interrupted download.
      throw error;
    });
  }
  return Snd.bufs[k];
}
async function setLayer(layer, key){
  if(!Snd.ctx || Snd.cur[layer] === key) return;
  Snd.cur[layer] = key;
  const old = Snd.nodes[layer];
  const now = Snd.ctx.currentTime;
  if(old){
    try{
      old.g.gain.cancelScheduledValues(now);
      old.g.gain.setValueAtTime(old.g.gain.value, now);
      old.g.gain.linearRampToValueAtTime(0, now + 1.6);
      old.src.stop(now + 1.7);
    }catch(e){}
    Snd.nodes[layer] = null;
  }
  if(!key) return;
  let buf;
  try{ buf = await getBuf(key); }catch(e){ return; }
  if(Snd.cur[layer] !== key) return;
  const src = Snd.ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  src.loopStart = .05; src.loopEnd = Math.max(.1, buf.duration - .05);
  const g = Snd.ctx.createGain();
  const t = Snd.ctx.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(VOL[key], t + 2.2);
  src.connect(g); g.connect(Snd.master);
  src.start(0, .05);
  Snd.nodes[layer] = {src, g};
}
function applySound(){
  if(!Snd.ctx || !Snd.on) return;
  const id = st.scene;
  if(!id){ setLayer("mus","theme"); setLayer("amb",null); return; }
  setLayer("mus", MUS_JAZZ.has(id) ? "jazz" : "theme");
  setLayer("amb", AMB_RAIN.has(id) ? "rain" : AMB_FIRE.has(id) ? "fire" : null);
}
function syncSndBtn(){
  const b = $("snd"); if(!b) return;
  b.setAttribute("aria-pressed", Snd.on ? "true" : "false");
  b.textContent = Snd.on ? "声音 · 开" : "开启声音";
}
function toggleSound(){
  Snd.on = !Snd.on;
  try{ localStorage.setItem("widow-sound-v2", Snd.on ? "on" : "off"); }catch(e){}
  audioInit();
  if(Snd.master){
    const t = Snd.ctx.currentTime;
    Snd.master.gain.cancelScheduledValues(t);
    Snd.master.gain.setValueAtTime(Snd.master.gain.value, t);
    Snd.master.gain.linearRampToValueAtTime(Snd.on ? 1 : 0, t + .6);
  }
  applySound();
  syncSndBtn();
}
document.addEventListener("visibilitychange", () => {
  if(!Snd.ctx) return;
  try{ document.hidden ? Snd.ctx.suspend() : Snd.ctx.resume(); }catch(e){}
});

function feedback(before){
  if(st.t > before.t){ pulseUntil = performance.now() + 1600; toast(pickOne(TOAST_T)); }
  else if((st.h || 0) > (before.h || 0)) toast(pickOne(TOAST_H), "h");
  else if(st.s > before.s) toast(pickOne(TOAST_S), "s");
}

/* ---------- modal ---------- */
function modal(build){
  const ov = el("div","ov");
  ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
  const box = el("div","ovbox");
  const x = el("button","ovx","关闭"); x.type = "button";
  const close = () => { ov.remove(); document.removeEventListener("keydown", esc); document.body.classList.remove("noscroll"); };
  const esc = e => { if(e.key === "Escape") close(); };
  x.addEventListener("click", close);
  ov.addEventListener("click", e => { if(e.target === ov) close(); });
  document.addEventListener("keydown", esc);
  box.appendChild(x);
  build(box, close);
  ov.appendChild(box);
  document.body.appendChild(ov);
  document.body.classList.add("noscroll");
  x.focus();
}

/* ---------- route map ---------- */

  ["第一章", [["p1"],["p2a","p2b","p2c"],["p3"],["m1"]]],
  ["第二章", [{A:[["a1","a1b"],["a2"],["a2b"]], B:[["b1","b1b"],["b2"]]}, ["q1"],["q1a","q1b","q1c"],["q2"]]],
  ["幕间 · 她", [["i1"],["i2"]]],
  ["第三章", [["f1"],["f2"],["f3"],["f3a","f3b","f3c"],["o1"],["o2"]]],
  ["第四章", [{A:[["a3"],["a4","a4h"],["a5"],["a5a","a5b","a5c"]], B:[["b3"],["b4"],["b4a","b4b"],["b5"]]}]],
  ["幕间 · 她", [["i3"],["i3a","i3b"]]],
  ["终章", [["c1"],["c2"],{A:[["rA","rH"]], B:[["rB"]]}]]
];
const HIDDEN_NODES = new Set(["a4h","rH"]);
function openMap(){
  modal(box => {
    box.appendChild(el("p","ovsub","ROUTE · 路线图"));
    box.appendChild(el("h2","ovh","调查路线"));
    const all = [];
    MAP.forEach(([, rows]) => rows.forEach(r => { if(Array.isArray(r)) all.push(...r); else ["A","B"].forEach(k => r[k].forEach(x => all.push(...x))); }));
    const got = all.filter(id => seen.indexOf(id) > -1).length;
    box.appendChild(el("p","mstat","已走过 " + got + " / " + all.length + " 个场景　·　已解锁结局 " + unlocked.length + " / " + ENDINGS.length));
    const chipRow = ids => {

      ids.forEach(id => {

        const c = el("span","chip" + (sn ? " seen" : "") + (id === st.scene ? " cur" : "") + (HIDDEN_NODES.has(id) ? " hid" : ""), sn ? S[id].title : "？？？");
        r.appendChild(c);
      });
      return r;
    };
    const map = el("div","map");
    MAP.forEach(([name, rows]) => {
      const sec = el("div","msec");
      sec.appendChild(el("h4",null,name));
      rows.forEach(r => {

        const lanes = el("div","lanes");
        [["A","宅子线"],["B","继子线"]].forEach(([k, label]) => {
          const ln = el("div","lane"); ln.appendChild(el("small",null,label));
          r[k].forEach(x => ln.appendChild(chipRow(x)));
          lanes.appendChild(ln);
        });
        sec.appendChild(lanes);
      });
      map.appendChild(sec);
    });
    const es = el("div","msec");
    es.appendChild(el("h4",null,"结局"));
    const er = el("div","mrow");
    ENDINGS.forEach(([id, name], k) => {
      const on = unlocked.indexOf(id) > -1;
      er.appendChild(el("span","chip end" + (on ? " seen" : "") + (k >= 9 ? " hid" : ""), on ? name : "？？？"));
    });
    es.appendChild(er);
    map.appendChild(es);
    box.appendChild(map);
  });
}
function mapBtn(){ const b = el("button","ghost","路线图"); b.type = "button"; b.addEventListener("click", openMap); return b; }

/* ---------- resolve special targets ---------- */
function resolve(go){
  if(go[0] !== "@") return go;
  const A = st.route === "A";
  switch(go){
    case "@afterFuneral": return A ? "a3" : "b3";
    case "@her": return A ? "rA" : "E9";
    case "@butler": return A ? (has("tin") ? "E10" : "E3") : "E9";
    case "@julian": return A ? "E6" : "rB";
    case "@unknown": return "E7";
    case "@burn": return "E8";
    case "@endA": return st.t >= TLINE ? "E2" : "E1";
    case "@endB": return st.t >= TLINE ? "E5" : "E4";
  }
  return "p0";
}
function allowed(c){
  if(c.req === "burn") return st.route === "A" && st.t >= BURN;
  if(c.req === "pair") return st.route === "A" && has("tin") && (st.h || 0) >= 3;
  return true;
}

/* ---------- dom helpers ---------- */
const $ = id => document.getElementById(id);
function el(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
const has = f => st.flags.indexOf(f) > -1;

function para(raw, sc){
  let cls = "n", t = raw, face = null;
  const m = /^([LVECJHMW])([1-4])?\|/.exec(raw);
  if(m){
    cls = {L:"l",V:"v",E:"em",C:"card",J:"j",H:"h",M:"m",W:"w"}[m[1]];
    t = raw.slice(m[0].length);
    if(m[1] === "V") face = m[2] ? "v" + m[2] : (sc.fv || "v1");
    if(m[1] === "L") face = m[2] ? "l" + m[2] : (sc.fl || "l1");
    if(m[1] === "J") face = "j1";
    if("HMW".indexOf(m[1]) > -1) face = m[1].toLowerCase() + (m[2] || "1");
  }
  const p = el("p", cls, t);
  if(!face) return p;
  p.classList.add("say");
  const a = el("span","face");
  a.style.backgroundImage = "url(" + IMG[face] + ")";
  a.setAttribute("aria-hidden","true");
  p.insertBefore(a, p.firstChild);
  return p;
}

/* ---------- enter scene ---------- */
function enter(id){
  id = resolve(id);
  const sc = S[id];
  st.last = null;
  if(sc.clue && st.clues.indexOf(sc.clue) < 0){ st.clues.push(sc.clue); st.last = sc.clue; }
  if(sc.d) bump(sc.d);
  if(sc.ending && unlocked.indexOf(sc.ending) < 0) unlocked.push(sc.ending);
  st.scene = id;
  markSeen(id);
  save();
  render(true);
  try{ window.scrollTo({top:0, behavior:"auto"}); }catch(e){ window.scrollTo(0,0); }
}
function bump(d){
  if(d.t) st.t = Math.min(TMAX, st.t + d.t);
  if(d.s) st.s = Math.min(SMAX, st.s + d.s);
  if(d.h) st.h = (st.h || 0) + d.h;
}
function pick(c){
  audioInit();
  const before = {t:st.t, s:st.s, h:st.h || 0};
  if(c.d) bump(c.d);
  if(c.flag && !has(c.flag)) st.flags.push(c.flag);
  if(c.route){ st.route = c.route; st.flags.push("route" + c.route); }
  enter(c.go);
  feedback(before);
}

/* ---------- render ---------- */
function render(animate){
  const story = $("story");
  story.innerHTML = "";
  if(!st.scene){ renderTitle(story); renderDossier(); applySound(); return; }
  const sc = S[st.scene];
  const her = sc.pov === "she";
  document.body.classList.toggle("her", her);
  $("chap").textContent = "案卷 No.1031-47 · " + sc.chap;
  $("pov").hidden = false; $("pov").textContent = her ? "视角 · 她" : "视角 · 他";
  $("meters").hidden = false;
  renderDots();

  if(sc.ending){
    const s = el("div","stamp"); s.appendChild(el("small",null,"CASE CLOSED · 结案"));
    s.appendChild(document.createTextNode(sc.title));
    story.appendChild(s);
  } else {
    story.appendChild(el("h1","scene-head",sc.title));
    story.appendChild(el("p","scene-sub", her ? "薇薇安·范德林" : "莱昂·肖探员"));
  }

  if(sc.cg){
    const fig = el("figure","cg");
    const img = el("img");
    img.src = IMG[sc.cg]; img.alt = ""; img.decoding = "async";
    if(sc.cgPos) img.style.objectPosition = sc.cgPos;
    fig.appendChild(img);
    fig.appendChild(el("figcaption",null,"轻触展开插图"));
    fig.tabIndex = 0;
    const tog = () => { fig.classList.toggle("open"); fig.lastChild.textContent = fig.classList.contains("open") ? "轻触收起" : "轻触展开插图"; };
    fig.addEventListener("click", tog);
    fig.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); tog(); } });
    story.appendChild(fig);
  }
  const box = el("div","text" + (animate ? " fx" : ""));
  let i = 0;
  sc.text.forEach(p => {
    let raw = p;
    if(typeof p === "object"){
      if(p.if && !has(p.if)) return;
      if(p.ifnot && has(p.ifnot)) return;
      raw = p.t;
    }
    const node = para(raw, sc);
    if(animate) node.style.animationDelay = (i * 90) + "ms";
    i++;
    box.appendChild(node);
  });
  story.appendChild(box);
  if(sc.post){
    const fig = el("figure","cg post");
    const img = el("img"); img.src = IMG[sc.post]; img.alt = ""; img.decoding = "async";
    fig.appendChild(img); story.appendChild(fig);
  }

  if(sc.ending){
    story.appendChild(el("p","coda",sc.coda + "　已解锁结局 " + unlocked.length + " / " + ENDINGS.length));
    if(sc.egg){
      const eggBtn = el("button","egg-btn","翻开最后一页 · 彩蛋");
      const eggBox = el("div","text egg");
      eggBox.hidden = true;
      eggBox.appendChild(el("p","scene-sub","彩蛋 · 洗礼"));
      if(sc.eggCg){
        const fig = el("figure","cg open");
        const img = el("img"); img.src = IMG[sc.eggCg]; img.alt = ""; img.decoding = "async";
        fig.appendChild(img); eggBox.appendChild(fig);
      }
      sc.egg.forEach(raw => eggBox.appendChild(para(raw, sc)));
      eggBtn.addEventListener("click", () => { eggBox.hidden = false; eggBtn.hidden = true; eggBox.classList.add("fx"); eggBox.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"}); });
      story.appendChild(eggBtn);
      story.appendChild(eggBox);
    }
    const row = el("div","row");
    const again = el("button","primary","重新开卷");
    again.addEventListener("click", () => { audioInit(); st = fresh(); enter("p0"); });
    const home = el("button","ghost","返回卷首");
    home.addEventListener("click", () => { st = fresh(); save(); document.body.classList.remove("her"); render(false); });
    row.appendChild(again); row.appendChild(home); row.appendChild(mapBtn());
    story.appendChild(row);
  } else {
    const ch = el("div","choices");
    const list = sc.choices ? sc.choices.filter(allowed) : [{t:"继续", go: sc.next}];
    list.forEach((c, k) => {
      const b = el("button","choice" + (c.her ? " as-her" : "") + (c.req === "burn" ? " dark" : c.req === "pair" ? " hidden" : ""));
      b.type = "button";
      b.appendChild(el("b", null, sc.choices ? String.fromCharCode(65 + k) : "→"));
      b.appendChild(el("span", null, c.t));
      b.addEventListener("click", () => pick(c));
      ch.appendChild(b);
    });
    story.appendChild(ch);
    const row = el("div","row");
    const restart = el("button","ghost","从头再来");
    restart.addEventListener("click", () => { st = fresh(); save(); document.body.classList.remove("her"); render(false); });
    row.appendChild(restart);
    row.appendChild(mapBtn());
    story.appendChild(row);
  }
  renderDossier();
  applySound();
}

  const d = $("dots"); d.innerHTML = "";

/* ---------- 心弦: a string that trembles with tension ---------- */
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function strum(ts){
  const p = $("string");
  if(p){
    const boost = performance.now() < pulseUntil ? 2.4 : 1;
    const amp = st.t * 1.05 * boost + (boost > 1 ? 3 : 0);
    const y = reduce ? 10 + amp * .5 : 10 + amp * Math.sin(ts / (190 - st.t * 12));
    p.setAttribute("d", "M2 10 Q37 " + y.toFixed(2) + " 72 10");
  }
  if(!reduce) requestAnimationFrame(strum);
}

/* ---------- boot ---------- */
function start(data){
  load();
  if(data && data.st) st = Object.assign(fresh(), data.st);
  else st.scene = null; // always open on the title screen
  render(false);
  syncSndBtn();
  const sb = $("snd"); if(sb) sb.addEventListener("click", toggleSound);
  if(reduce) strum(0); else requestAnimationFrame(strum);
}
if(window.claude && window.claude.hot && window.claude.hot.snapshot){
  try{ window.claude.hot.snapshot(() => ({st})); }catch(e){}
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
